<p>Garis abu-abu adalah gelombang asli. Titik biru adalah sampel (titik data). Garis oranye menunjukkan gelombang yang &ldquo;terlihat&rdquo; dari titik-titik itu. Naikkan frekuensi sinyal atau kurangi titik data, lalu amati kapan gelombang salah terbaca.</p>
<label for='fs'>Frekuensi sinyal: <span id='fsv'></span> siklus per jendela sampling</label>
<input type='range' id='fs' min='1' max='24' value='3'>
<label for='np2'>Jumlah titik data dalam jendela (matriks frekuensi): <span id='npv'></span></label>
<input type='range' id='np2' min='4' max='48' value='16'>
<canvas id='cn' width='600' height='200' style='width:100%' role='img' aria-label='Gelombang asli, titik sampel, dan gelombang yang terbaca'></canvas>
<p id='ketn' aria-live='polite'></p>
<button id='reset7' type='button'>Reset</button>
