<!-- A7.3 Simulator pindai: isi ruang-k baris demi baris. Judul dan hubungan ke materi diatur di struktur/m04b.json. File ini hanya isi kartu. -->
<p>Setiap TR mengisi satu baris ruang-k. Geser slider atau tekan Putar, lalu amati kapan citra mulai dikenali. Bandingkan dua urutan pengisian.</p>
<label for='urut'>Urutan pengisian</label>
<select id='urut'><option value='lin'>Linier (atas ke bawah)</option><option value='pk'>Pusat ke luar</option></select>
<label for='tr'>TR (ms)</label><input type='number' id='tr' min='50' max='10000' step='50' value='500'>
<label for='nx'>NEX</label><input type='number' id='nx' min='1' max='16' step='1' value='1'>
<label for='brs'>Baris terisi: <span id='brsv'></span> dari 64</label>
<input type='range' id='brs' min='0' max='64' value='0'>
<div class='baris'>
<figure><canvas id='ks' class='cit' width='64' height='64' role='img' aria-label='Ruang-k yang sedang terisi'></canvas><figcaption>Ruang-k terisi</figcaption></figure>
<figure><canvas id='cs' class='cit' width='64' height='64' role='img' aria-label='Citra sementara'></canvas><figcaption>Citra sementara</figcaption></figure>
</div>
<p id='ketp' aria-live='polite'></p>
<div class='stp'><button id='play' type='button'>Putar</button><button id='reset4' type='button'>Reset</button></div>
