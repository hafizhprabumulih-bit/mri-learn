<!doctype html>
<html lang='id'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>MODUL 4: Pembentukan Citra</title>
<link rel='stylesheet' href='css/dasar.css'>
<link rel='stylesheet' href='css/modul.css'>
</head>
<body>
<main>
<nav class='atas'><a href='../index.html' target='_top'>&larr; Dasbor</a><span></span></nav>
<h1>MODUL 4: Pembentukan Citra</h1>
<p class='lembut'>Dibagi menjadi tiga pecahan menurut tahap belajar. Media belajar, bukan untuk keputusan klinis.</p>
<div id='daftar'><p class='lembut'>Memuat...</p></div>
</main>
<script>
(async()=>{
 const d=document.getElementById('daftar');
 const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
 try{
  let h='';
  for(const k of ['m04a','m04b','m04c']){
   const r=await fetch('struktur/'+k+'.json');if(!r.ok)throw new Error(k+' '+r.status);
   const S=await r.json();
   const datar=a=>a.flatMap(n=>[n].concat(datar(n.anak||[])));
   const nm=datar(S.materi.node).filter(n=>n.file).length,ns=datar(S.simulasi).filter(n=>n.html).length;
   h+='<div class="kartu"><h2 style="margin-top:0"><a href="'+k+'.html">'+esc(S.id)+': '+esc(S.judul)+'</a></h2><p class="lembut">'+esc(S.pecahan)+'. Prasyarat: '+esc(S.prasyarat.join(', '))+'.</p><p>'+nm+' kartu materi, '+ns+' simulasi, kuis '+esc(S.materi.judul)+'.</p></div>';
  }
  d.innerHTML=h;
 }catch(e){d.innerHTML='<div class="galat"><b>Tidak dapat memuat daftar.</b><p>'+esc(e.message)+'</p><p>Buka lewat Live Server (bukan file://).</p></div>';}
})();
</script>
</body>
</html>
