name: Build debug APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Terima lisensi SDK dan tampilkan paket yang tersedia
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          echo "Paket platform dan build-tools yang tersedia (untuk diagnosis):"
          "$SDKMANAGER" --list 2>/dev/null | grep -E "platforms;android-3[6-9]|build-tools;3[6-9]" || true

      - name: Bangun APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: MRIlearn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
